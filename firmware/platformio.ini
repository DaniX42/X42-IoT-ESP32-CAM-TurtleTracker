[platformio]
default_envs = ai_thinker
extra_configs = secrets.ini

[env:ai_thinker]
platform = espressif32
board = esp32cam
framework = arduino
monitor_speed = 115200
upload_speed = 115200
upload_protocol = espota
upload_flags = --auth=${sysenv.TT_OTA_PASSWORD}
board_build.partitions = partitions_ota.csv
extra_scripts = pre:scripts/generate_secrets.py
lib_deps =
  bblanchon/ArduinoJson@^7.0.4
  knolleary/PubSubClient@^2.8

; USB/serial variant for the initial flash; keeps the same OTA partition table
; so ArduinoOTA continues to work for subsequent uploads via env:ai_thinker.
[env:ai_thinker_usb]
extends = env:ai_thinker
upload_protocol = esptool
upload_speed = 460800
upload_flags =
